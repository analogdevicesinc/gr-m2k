name: Build and Deploy gr-m2k

permissions:
  contents: read

env:
  APP_NAME: gr-m2k

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '20[1-9][0-9]_R[1-9]'
      - staging/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - '20[1-9][0-9]_R[1-9]'

jobs:
  identify_version:
    runs-on: ubuntu-24.04
    outputs:
      app-version: ${{ steps.set_version.outputs.version }}
    steps:
    - name: Checkout code repository
      uses: actions/checkout@v6
    - name: Set app version
      id: set_version
      run: |
        # Extract version from CMakeLists.txt VERSION_MAJOR/API/PATCH variables
        major=$(grep -oP 'set\s*\(\s*VERSION_MAJOR\s+\K[0-9]+' CMakeLists.txt)
        api=$(grep -oP 'set\s*\(\s*VERSION_API\s+\K[0-9]+' CMakeLists.txt)
        patch=$(grep -oP 'set\s*\(\s*VERSION_PATCH\s+\K[0-9]+' CMakeLists.txt)

        if [[ -n "$major" && -n "$api" && -n "$patch" ]]; then
            cmake_version="$major.$api.$patch"
        else
            echo "Failed to extract version from CMakeLists.txt, using default"
            cmake_version="0.0.1+${{ github.sha }}"
        fi

        echo "Version to use: $cmake_version"
        echo "version=$cmake_version" >> "$GITHUB_OUTPUT"

  # amd64: the composite action runs directly on the host runner.
  build_ubuntu:
    runs-on: ubuntu-24.04
    needs: identify_version
    steps:
    - name: Checkout code repository
      uses: actions/checkout@v6
      with:
        path: ${{ env.APP_NAME }}

    - name: Create .deb package
      uses: analogdevicesinc/shared-actions/deb-generator-action@main
      with:
        version: ${{ needs.identify_version.outputs.app-version }}
        working-directory: ${{ env.APP_NAME }}

    - name: Upload debian artifacts to github
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.APP_NAME }}-ubuntu
        path: ${{ github.workspace }}/artifacts/*
        if-no-files-found: error

  # arm64/armhf: run the action's build-deb.sh inside the target Debian
  # container, as documented in the deb-generator-action README.
  build_arm:
    runs-on: ubuntu-24.04-arm
    needs: identify_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            docker_image: arm64v8/debian:trixie
            platform_flag: ""
          - architecture: armhf
            docker_image: arm32v7/debian:trixie
            platform_flag: "--platform linux/arm/v7"
    steps:
    - name: Checkout code repository
      uses: actions/checkout@v6
      with:
        path: ${{ env.APP_NAME }}

    - name: Checkout deb-generator-action
      uses: actions/checkout@v6
      with:
        repository: analogdevicesinc/shared-actions
        path: shared-actions

    - name: Start build container
      run: |
        docker run -d --name builder ${{ matrix.platform_flag }} \
          -v "$GITHUB_WORKSPACE/${{ env.APP_NAME }}:/src/${{ env.APP_NAME }}" \
          -v "$GITHUB_WORKSPACE/shared-actions:/src/shared-actions" \
          -e GITHUB_WORKSPACE=/src \
          ${{ matrix.docker_image }} sleep infinity

    - name: Install container prerequisites
      # The base debian image has no curl; the action needs it to add the
      # ADI package feed.
      run: |
        docker exec builder sh -c "apt-get update && apt-get install -y curl ca-certificates"

    - name: Create .deb package
      run: |
        docker exec \
          -e VERSION=${{ needs.identify_version.outputs.app-version }} \
          -e WORKING_DIRECTORY=/src/${{ env.APP_NAME }} \
          -e GITHUB_WORKSPACE=/src \
          builder bash /src/shared-actions/deb-generator-action/build-deb.sh

    - name: Copy debian artifacts from container to host
      run: |
        mkdir -p artifacts
        docker cp builder:/src/artifacts/. artifacts/
        ls -la artifacts/

    - name: Upload debian artifacts to github
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.APP_NAME }}-debian13-${{ matrix.architecture }}
        path: ${{ github.workspace }}/artifacts/*
        if-no-files-found: error
